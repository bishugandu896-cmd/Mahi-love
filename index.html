<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Love</title>
    <style>
        body {
            background-color: #ffcccb;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        h1 {
            color: #d5006d;
            font-size: 3em;
        }
        .rose {
            width: 100px;
            animation: sway 3s infinite alternate;
        }
        @keyframes sway {
            0% { transform: translate(0, 0); }
            100% { transform: translate(20px, 0); }
        }
    </style>
</head>
<body>
    <h1>Welcome to My Romantic Love Page</h1>
    <img class="rose" src="https://example.com/rose.png" alt="Rose">
    <p>Love is not just a word, it's a beautiful emotion that brings joy and happiness.</p>
    <p>🌹🌸🌼</p>
    <footer>
        <p>Created with love on 2026-03-15</p>
    </footer>
</body>
</html>
