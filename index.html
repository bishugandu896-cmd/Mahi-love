<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Website for Mahi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, pink, purple);
            animation: gradient 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #container {
            text-align: center;
            color: white;
            z-index: 1;
        }

        .rose {
            position: absolute;
            width: 100px;
            height: 100px;
            animation: bloom 5s infinite;
        }

        @keyframes bloom {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .star {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            animation: twinkle 1.5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .falling-petal {
            position: absolute;
            animation: fall 4s infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        .button {
            padding: 10px 20px;
            background-color: purple;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.1);
            animation: confetti 0.5s forwards;
        }

        @keyframes confetti {
            from { transform: scale(1); }
            to { transform: scale(1); } /* Add confetti effect here */
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
        }

        /* Add more styles for reasons and memories sections */
    </style>
</head>
<body>
    <div id="container">
        <h1>Welcome to Mahi's Romantic Website!</h1>
        <p>Some love messages here...</p>
        <button class="button">I Love You!</button>
        <div class="rose"></div>
        <div class="star" style="left: 10%; top: 20%;"></div>
        <div class="falling-petal" style="left: 30%; animation-delay: 2s;"></div>
        <div class="falling-petal" style="left: 70%; animation-delay: 3s;"></div>
        <!-- Continue adding more petals and stars -->
    </div>
    <script>
        // JavaScript for dynamic effects
        // Implement dynamic messages, confetti effects, etc.
    </script>
</body>
</html>
