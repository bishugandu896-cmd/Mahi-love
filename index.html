<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Romantic Experience for Mahi</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ffcccb, #ff99cc);
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }
        .header {
            text-align: center;
            padding: 50px;
            font-size: 3em;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.8);
        }
        .reasons, .gallery {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .reason, .memory {
            padding: 20px;
            background: rgba(255, 20, 147, 0.7);
            border-radius: 15px;
            transition: transform 0.3s;
        }
        .reason:hover, .memory:hover {
            transform: scale(1.05);
        }
        .animated-roses {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('roses.png');
            background-size: cover;
            opacity: 0.1;
            animation: fade 10s infinite;
        }
        @keyframes fade {
            0% { opacity: 0.1; }
            50% { opacity: 0.5; }
            100% { opacity: 0.1; }
        }
    </style>
</head>
<body>
    <div class="animated-roses"></div>
    <div class="header">For Mahi, My Love</div>
    <div class="reasons">
        <div class="reason">You make me smile.</div>
        <div class="reason">Your laughter is my favorite sound.</div>
        <div class="reason">You are my best friend.</div>
        <div class="reason">I love your kindness.</div>
        <div class="reason">You inspire me every day.</div>
    </div>
    <div class="gallery">
        <div class="memory">Memory 1 Description</div>
        <div class="memory">Memory 2 Description</div>
        <div class="memory">Memory 3 Description</div>
        <div class="memory">Memory 4 Description</div>
    </div>
    <script>
        // JavaScript for effects
        document.body.addEventListener('mousemove', function(e) {
            const hearts = document.createElement('div');
            hearts.classList.add('heart');
            hearts.style.left = e.pageX + 'px';
            hearts.style.top = e.pageY + 'px';
            document.body.appendChild(hearts);
            setTimeout(() => hearts.remove(), 1000);
        });
    </script>
</body>
</html>
